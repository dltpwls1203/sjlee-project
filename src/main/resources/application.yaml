server:
  port: 8090

spring:
  application:
    name: sjlee-project
  thymeleaf:
    cache: false

  datasource:
    url: jdbc:postgresql://localhost:5432/sjlee_db
    username: sjlee
    password: 1234
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
