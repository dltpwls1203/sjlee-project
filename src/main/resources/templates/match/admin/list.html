<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="layout/head :: head"></th:block>
    <title>경기 관리</title>
</head>

<body>
<div class="wrapper">

    <!-- 사이드바 -->
    <th:block th:replace="layout/aside :: aside"></th:block>

    <!-- 메인 컨텐츠 -->
    <div class="content-wrapper">

        <!-- 페이지 헤더 -->
        <section class="content-header">
            <h1>경기 목록</h1>
        </section>

        <!-- 본문 -->
        <section class="content">
            <!-- 검색 Card -->
            <div class="card">
                <div class="card-body">
                    <form id="searchForm">
                        <!-- 검색 + 등록 버튼 -->
                        <div class="d-flex justify-content-between align-items-end mb-3">
                            <div class="flex-grow-1 mr-3">
                                <div class="form-row">
                                    <div class="col-md-3">
                                        <label>경기일</label>
                                        <input type="month" class="form-control" id="matchMonth">
                                    </div>

                                    <div class="col-md-3">
                                        <label>상대팀</label>
                                        <input type="text"
                                               class="form-control"
                                               id="opponentName"
                                               placeholder="상대팀">
                                    </div>

                                    <div class="col-md-2">
                                        <label>결과</label>
                                        <select class="form-control" id="result">
                                            <option value="">전체</option>
                                            <option value="WIN">승</option>
                                            <option value="DRAW">무</option>
                                            <option value="LOSE">패</option>
                                        </select>
                                    </div>

                                    <div class="col-md-2">
                                        <label>경기 타입</label>
                                        <select class="form-control" id="matchType">
                                            <option value="">전체</option>
                                            <option value="EXTERNAL">시합</option>
                                            <option value="INTERNAL">자체전</option>
                                        </select>
                                    </div>

                                    <div class="col-md-2">
                                        <label>경기장</label>
                                        <input type="text"
                                               class="form-control"
                                               id="groundName"
                                               placeholder="경기장">
                                    </div>
                                </div>

                                <div class="d-flex justify-content-end mt-3">
                                    <button type="submit"
                                            id="btnSearch"
                                            class="btn btn-primary mr-2">
                                        <i class="fas fa-search"></i> 검색
                                    </button>

                                    <button type="button"
                                            id="btnReset"
                                            class="btn btn-secondary">
                                        <i class="fas fa-redo"></i> 초기화
                                    </button>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
            </div>

            <div class="card">
                <div class="card-body">
                    <div class="text-right mb-2">
                        <a href="/admin/matches/new" class="btn btn-primary">
                            경기 등록
                        </a>
                    </div>

                    <table class="table table-bordered">
                        <thead>
                        <tr>
                            <th>번호</th>
                            <th>경기일</th>
                            <th>경기장소</th>
                            <th>상대팀</th>
                            <th>결과 (스코어)</th>
                            <th>상태</th>
                            <th>참석자 수</th>
                            <th>상세</th>
                        </tr>
                        </thead>

                        <!-- JS 렌더링 영역 -->
                        <tbody id="matchTableBody">
                        <tr>
                            <td colspan="8" class="text-center">로딩 중...</td>
                        </tr>
                        </tbody>
                    </table>
                    <!-- 페이징 html-->
                    <div class="mt-3 d-flex justify-content-center">
                        <ul id="pagination" class="pagination"></ul>
                    </div>
                </div>
            </div>
        </section>

    </div>
</div>

<!-- JS -->
<script src="/js/common/pagination.js"></script>
<script src="/js/match/admin/list.js"></script>
</body>
</html>
