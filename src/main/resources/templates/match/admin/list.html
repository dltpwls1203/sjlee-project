<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="layout/head :: head"></th:block>
    <title>경기 관리</title>
</head>

<body>
<div class="wrapper">

    <!-- 사이드바 -->
    <th:block th:replace="layout/aside :: aside"></th:block>

    <!-- 메인 컨텐츠 -->
    <div class="content-wrapper">

        <!-- 페이지 헤더 -->
        <section class="content-header">
            <h1>경기 목록</h1>
        </section>

        <!-- 본문 -->
        <section class="content">
            <div class="card">

                <div class="card-body">
                    <div class="text-right mb-2">
                        <a href="/admin/matches/new" class="btn btn-primary">
                            경기 등록
                        </a>
                    </div>

                    <table class="table table-bordered">
                        <thead>
                        <tr>
                            <th>번호</th>
                            <th>경기일</th>
                            <th>경기장소</th>
                            <th>상대팀</th>
                            <th>결과 (스코어)</th>
                            <th>상태</th>
                            <th>참석자 수</th>
                            <th>상세</th>
                        </tr>
                        </thead>

                        <!-- JS 렌더링 영역 -->
                        <tbody id="matchTableBody">
                        <tr>
                            <td colspan="8" class="text-center">로딩 중...</td>
                        </tr>
                        </tbody>
                    </table>

                </div>

            </div>
        </section>

    </div>
</div>

<!-- JS -->
<script src="/js/match/admin/list.js"></script>
</body>
</html>
