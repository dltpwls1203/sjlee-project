<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="layout/head :: head"></th:block>
    <title>상대팀 관리</title>
</head>

<body>
<div class="wrapper">

    <!-- 사이드바 -->
    <th:block th:replace="layout/aside :: aside"></th:block>

    <div class="content-wrapper">

        <!-- 페이지 헤더 -->
        <section class="content-header">
            <h1>상대팀 목록</h1>
        </section>

        <!-- 본문 -->
        <section class="content">
            <div class="card">

                <div class="card-body">

                    <!-- 필터 영역 -->
                    <div class="d-flex justify-content-between mb-3">

                        <!-- 검색 -->
                        <div class="form-inline">
                            <input type="text"
                                   id="keyword"
                                   class="form-control mr-2"
                                   placeholder="이름 검색">

                            <button class="btn btn-secondary"
                                    onclick="searchOpponentTeam()">
                                검색
                            </button>
                        </div>

                        <!-- 상대팀 등록 -->
                        <a href="/admin/opponent-teams/new"
                           class="btn btn-primary">
                            상대팀 등록
                        </a>

                    </div>

                    <!-- 선수 테이블 -->
                    <table class="table table-bordered table-hover">
                        <thead>
                        <tr>
                            <th>번호</th>
                            <th>상대팀 명</th>
                            <th>실력</th>
                            <th>나이대</th>
                            <th>매치 횟수</th>
                        </tr>
                        </thead>

                        <!-- JS 렌더링 영역 -->
                        <tbody id="opponentTeamTableBody">
                        <tr>
                            <td colspan="5" class="text-center">
                                로딩 중...
                            </td>
                        </tr>
                        </tbody>
                    </table>
                    <!-- 페이징 html-->
                    <div class="mt-3 d-flex justify-content-center">
                        <ul id="pagination" class="pagination"></ul>
                    </div>
                </div>
            </div>
        </section>

    </div>
</div>

<!-- JS -->
<script src="/js/common/pagination.js"></script>
<script src="/js/opponentTeam/admin/list.js"></script>
</body>
</html>
